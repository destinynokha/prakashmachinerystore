<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prakash Machinery Store | INGCO Tools, Welding Machines & Equipment</title>
    <meta name="description"
        content="Your trusted partner for quality machinery tools and equipment. Browse our catalog, save favorites, and place orders online.">
    <!-- Force HTTPS Redirect -->
    <script>
        if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.href = 'https:' + window.location.href.substring(window.location.protocol.length);
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<body>
    <div id="app">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-inner">
                <a href="#" class="navbar-logo" id="navbar-logo">
                    <img src="img/logo.png" alt="Logo" onerror="this.style.display='none'">
                    <span>Prakash Machinery</span>
                </a>
                <div class="navbar-search">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Search products...">
                </div>
                <div class="navbar-actions">
                    <button class="nav-btn nav-btn-icon mobile-menu-btn" id="mobile-search-toggle"
                        title="Search">🔍</button>
                    <button class="nav-btn nav-btn-icon mobile-menu-btn hamburger-btn" id="mobile-menu-toggle"
                        title="Menu">☰</button>

                    <div class="desktop-nav">
                        <a href="#" class="nav-btn" id="store-link">🏪 <span>Store</span></a>
                        <a href="#" class="nav-btn" id="pay-link">💳 <span>Pay</span></a>
                        <a href="#" class="nav-btn hidden" id="wish-link">❤️ <span>Wishlist</span></a>
                        <a href="#" class="nav-btn hidden" id="home-link">🏠 <span>Home</span></a>
                        <a href="#" class="nav-btn hidden" id="cart-link">🛒 <span>Cart</span><span class="badge"
                                id="cart-badge" style="display:none">0</span></a>
                        <a href="#" class="nav-btn hidden" id="admin-link">📋 <span>Admin</span></a>
                        <button class="nav-btn btn-login" id="login-btn">Sign in with Google</button>
                        <div class="hidden" id="user-menu-container" style="position:relative;">
                            <img class="user-avatar" id="user-avatar-btn" src="" alt="User">
                            <div class="user-menu" id="user-menu">
                                <div class="user-menu-header">
                                    <div class="name"></div>
                                    <div class="email"></div>
                                </div>
                                <button class="user-menu-item" id="my-orders-btn">📦 My Orders</button>
                                <button class="user-menu-item danger" id="sign-out-btn">🚪 Sign Out</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mobile Drawer Menu -->
            <div class="mobile-drawer" id="mobile-drawer">
                <div class="mobile-drawer-inner">
                    <button class="modal-close" id="mobile-drawer-close"
                        style="position:absolute;top:16px;right:16px">✕</button>
                    <div class="mobile-drawer-header">
                        <img src="img/logo.png" alt="Logo" style="height:32px;margin-bottom:8px"
                            onerror="this.style.display='none'">
                        <h3 style="font-family:var(--font-display);color:var(--primary)">Menu</h3>
                    </div>
                    <div class="mobile-drawer-links">
                        <a href="#" class="drawer-link" id="m-home-link">🏠 Home</a>
                        <a href="#" class="drawer-link" id="m-store-link">🏪 Store</a>
                        <a href="#" class="drawer-link" id="m-pay-link">💳 Pay via UPI</a>
                        <a href="#" class="drawer-link hidden" id="m-wish-link">❤️ Wishlist</a>
                        <a href="#" class="drawer-link hidden" id="m-cart-link">🛒 Cart <span class="badge"
                                id="m-cart-badge" style="display:none">0</span></a>
                        <a href="#" class="drawer-link hidden" id="m-admin-link">📋 Admin</a>
                    </div>
                    <div class="mobile-drawer-footer">
                        <button class="btn btn-primary" id="m-login-btn" style="width:100%">Sign in with Google</button>
                        <div id="m-user-section" class="hidden" style="width:100%">
                            <div class="m-user-info"
                                style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
                                <img src="" id="m-user-avatar"
                                    style="width:40px;height:40px;border-radius:50%;border:1px solid var(--border)">
                                <div>
                                    <div id="m-user-name" style="font-weight:600;font-size:0.95rem"></div>
                                    <div id="m-user-email" style="font-size:0.8rem;color:var(--text-secondary)"></div>
                                </div>
                            </div>
                            <button class="btn btn-outline" id="m-orders-btn" style="width:100%;margin-bottom:8px">📦 My
                                Orders</button>
                            <button class="btn btn-ghost" id="m-signout-btn" style="width:100%;color:var(--danger)">🚪
                                Sign Out</button>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content">
        <div class="loading-screen">
            <div class="spinner"></div>
            <p>Loading store...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="container">
            <p>&copy; 2024 Prakash Machinery Store. All Rights Reserved.</p>
            <p>📧 <a href="mailto:orders@prakashmachinerystore.com">orders@prakashmachinerystore.com</a> · 📞 <a
                    href="tel:+919414548021">+91 94145 48021</a></p>
        </div>
    </footer>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- App Scripts (order matters) -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
